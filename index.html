    <style>

        body {

        .error-box {

        .inapp-box strong { color: #fcd34d; }
        .copy-btn {
            margin-top: 0.75rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 0.6rem;
            border-radius: 0.6rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .google-btn {
            width: 100%;
            background: white;
            color: #1f2937;
            padding: 1rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }
        .google-btn:hover {
            background: #f9fafb;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }
        .google-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .google-icon {
            width: 1.25rem;
            height: 1.25rem;
        }

<body>

                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>

                    <path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.67.91-1.377 0-2.332-1.26-3.428-2.8-1.287-1.82-2.323-4.63-2.323-7.28 0-4.28 2.797-6.55 5.552-6.55 1.448 0 2.675.95 3.6.95.865 0 2.222-1.01 3.902-1.01.613 0 2.886.06 4.374 2.19-.13.09-2.383 1.37-2.383 4.19 0 3.26 2.854 4.42 2.955 4.45z" fill="#fff"/>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXuNDKYtP7DhF3r1V5x0q5SlrK-TO6TAM",
            authDomain: "winner-dinner-3e154.firebaseapp.com",
            databaseURL: "https://winner-dinner-3e154-default-rtdb.firebaseio.com",
            projectId: "winner-dinner-3e154",
            storageBucket: "winner-dinner-3e154.firebasestorage.app",
            messagingSenderId: "1063162162261",
            appId: "1:1063162162261:web:44ff6dcf320a8142fc78dc"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        // In the Android app, popups don't work in the WebView — use the
        // native Google account picker and hand its credential to the web SDK.
        function isNativeApp() {
            return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        }
        async function googleSignIn() {
            if (isNativeApp()) {
                const FirebaseAuthentication = window.Capacitor.Plugins.FirebaseAuthentication;
                const result = await FirebaseAuthentication.signInWithGoogle();
                const credential = firebase.auth.GoogleAuthProvider.credential(result.credential.idToken);
                await auth.signInWithCredential(credential);
            } else {
                await auth.signInWithPopup(googleProvider);
            }
        }
        function isCancelledSignIn(err) {
            return err.code === 'auth/popup-closed-by-user' || /cancel/i.test(err.message || '');
        }

        // Sign in with Apple: required in the iOS app (App Store rule 4.8),
        // offered on the website too. Hidden only in the Android app, whose
        // WebView can't run the OAuth popup.
        if (!isNativeApp() || window.Capacitor.getPlatform() === 'ios') {
            document.getElementById('appleBtn').style.display = 'flex';
        }
        async function appleSignIn() {
            if (isNativeApp()) {
                const FirebaseAuthentication = window.Capacitor.Plugins.FirebaseAuthentication;
                // skipNativeAuth: the Firebase iOS SDK can't reuse the plugin's
                // nonce, so hand the Apple credential to the web SDK ourselves.
                const result = await FirebaseAuthentication.signInWithApple({ skipNativeAuth: true });
                const provider = new firebase.auth.OAuthProvider('apple.com');
                const credential = provider.credential({
                    idToken: result.credential.idToken,
                    rawNonce: result.credential.nonce,
                });
                await auth.signInWithCredential(credential);
                // Apple only shares the name on the FIRST sign-in — persist it
                // or the user is "Anonymous" forever.
                const name = result.user && result.user.displayName;
                if (name && auth.currentUser && !auth.currentUser.displayName) {
                    await auth.currentUser.updateProfile({ displayName: name });
                }
            } else {
                const provider = new firebase.auth.OAuthProvider('apple.com');
                provider.addScope('email');
                provider.addScope('name');
                await auth.signInWithPopup(provider);
            }
        }
        async function signInApple() {
            var btn = document.getElementById('appleBtn');
            var errorBox = document.getElementById('error');
            btn.disabled = true;
            errorBox.style.display = 'none';
            try {
                await appleSignIn();
                window.location.href = appUrl;
            } catch (err) {
                if (!isCancelledSignIn(err)) {
                    errorBox.textContent = 'Sign in failed: ' + (err.code || '') + ' ' + (err.message || err);
                    errorBox.style.display = 'block';
                }
                btn.disabled = false;
            }
        }

        // Clean URL — no version param. app.html watches its own ETag and shows
        // an "update available" banner when a new version is deployed.
        const joinParam = new URLSearchParams(window.location.search).get('join');
        const appUrl = 'app.html' + (joinParam ? '?join=' + encodeURIComponent(joinParam) : '');

        // Google blocks OAuth inside embedded in-app browsers (LINE, Instagram,
        // etc.). Detect those and tell the user to open in a real browser.
        function detectInAppBrowser() {
            const ua = navigator.userAgent || '';
            if (/\bLine\//i.test(ua)) return 'LINE';
            if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'Facebook';
            if (/Instagram/i.test(ua)) return 'Instagram';
            if (/Messenger/i.test(ua)) return 'Messenger';
            if (/MicroMessenger/i.test(ua)) return 'WeChat';
            if (/Snapchat/i.test(ua)) return 'Snapchat';
            if (/(TikTok|musical_ly)/i.test(ua)) return 'TikTok';
            if (/Twitter/i.test(ua)) return 'Twitter';
            return null;
        }

        (function showInAppWarning() {
            if (isNativeApp()) return; // never inside our own app
            const app = detectInAppBrowser();
            if (!app) return;
            const box = document.getElementById('inappBox');
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
            const howTo = isIOS
                ? 'tap the menu (<strong>⋯</strong> or the arrow icon) and choose <strong>“Open in Safari / default browser.”</strong>'
                : 'tap the menu (<strong>⋮</strong>) and choose <strong>“Open in browser / Chrome.”</strong>';
            box.innerHTML = 'You opened this inside <strong>' + app + '</strong>, and Google blocks sign-in using in-app browsers. To continue, ' + howTo +
                '<button class="copy-btn" id="copyBtn" type="button">Copy link to paste in your browser</button>';
            box.style.display = 'block';
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.addEventListener('click', function () {
                const url = window.location.href;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url)
                        .then(function () { copyBtn.textContent = 'Copied! Open your browser & paste'; })
                        .catch(function () { window.prompt('Copy this link:', url); });
                } else {
                    window.prompt('Copy this link:', url);
                }
            });
        })();

        // If already signed in, go straight to app
        auth.onAuthStateChanged(function(user) {
            if (user) {
                window.location.href = appUrl;
            }
        });

        async function signIn() {
            var btn = document.getElementById('signInBtn');
            var errorBox = document.getElementById('error');
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorBox.style.display = 'none';
            try {
                await googleSignIn();
                window.location.href = appUrl;
            } catch (err) {
                if (!isCancelledSignIn(err)) {
                    errorBox.textContent = 'Sign in failed: ' + (err.code || '') + ' ' + (err.message || err);
                    errorBox.style.display = 'block';
                }
                btn.disabled = false;
                btn.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google';
            }
        }
    </script>
